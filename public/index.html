<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deliplus UK | Authentic Spanish Cosmetics &amp; Skincare — Worldwide Delivery</title>
    <meta name="description" content="Shop authentic Deliplus cosmetics from Mercadona in the UK. Spanish skincare, eye liners, facial serums, body care and haircare with fast UK delivery and worldwide shipping.">
    <link rel="canonical" href="https://deliplus.uk/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Deliplus UK">
    <meta property="og:title" content="Deliplus UK | Authentic Spanish Cosmetics &amp; Skincare">
    <meta property="og:description" content="Authentic Deliplus cosmetics from Mercadona — Spanish skincare, makeup, body and hair care delivered across the UK and worldwide.">
    <meta property="og:url" content="https://deliplus.uk/">
    <meta property="og:locale" content="en_GB">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="robots" content="index, follow">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        .dp-card{transition:box-shadow .2s ease}
        .dp-card:hover{box-shadow:0 8px 20px rgba(0,0,0,.08)}
    </style>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] font-sans selection:bg-emerald-100 selection:text-emerald-800">

    <!-- Announcement bar -->
    <div class="bg-[#006838] text-white text-center py-2.5 text-xs sm:text-sm font-medium tracking-wide">
        🌿 Worldwide shipping available! · Official Deliplus Collection
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white border-b border-[#E2E8F0]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-4">
            <a href="/" class="flex items-center gap-2 shrink-0">
                <span class="text-2xl sm:text-3xl font-black tracking-tight text-[#006838]">Deliplus</span>
                <span class="text-[11px] font-bold bg-[#D8F3E5] text-[#006838] px-2 py-0.5 rounded-full">UK</span>
            </a>

            <div class="hidden md:flex flex-1 justify-center px-2">
                <div class="relative w-full max-w-xl">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-[#94A3B8]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
                    <input type="search" id="product-search" placeholder="Search products, categories..." class="w-full bg-white border border-[#E2E8F0] rounded-full pl-10 pr-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#006838]/30 focus:border-[#006838]">
                </div>
            </div>

            <div class="flex items-center gap-3 sm:gap-5 ml-auto shrink-0">
                <button onclick="alert('Sign-in is coming soon. You can already order without an account — checkout is handled securely by Stripe.')" class="hidden lg:flex items-center gap-1.5 text-sm font-medium text-[#1E293B] hover:text-[#006838]">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Sign in
                </button>
                <button onclick="showWishlist()" class="hidden lg:flex items-center gap-1.5 text-sm font-medium text-[#1E293B] hover:text-[#006838]">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                    Wishlist
                </button>
                <button onclick="toggleCart()" class="relative flex items-center gap-2 bg-[#007A48] hover:bg-[#006838] text-white px-4 sm:px-5 py-2.5 rounded-full font-medium transition">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    <span class="text-sm font-semibold">Basket</span>
                    <span id="cart-count" class="bg-[#005934] text-white text-xs font-black min-w-[1.4rem] h-6 px-1.5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
        <!-- mobile search -->
        <div class="md:hidden px-4 pb-3">
            <div class="relative">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-[#94A3B8]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
                <input type="search" id="product-search-mobile" placeholder="Search products, categories..." class="w-full bg-white border border-[#E2E8F0] rounded-full pl-10 pr-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#006838]/30">
            </div>
        </div>
    </header>

    <!-- Category tabs -->
    <nav class="bg-white border-b border-[#E2E8F0]">
        <div id="category-buttons" class="max-w-7xl mx-auto px-4 sm:px-6 overflow-x-auto py-3 flex gap-2.5 no-scrollbar"></div>
    </nav>

    <!-- Product grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5"></div>
        <div id="no-results" class="hidden text-center text-gray-400 text-sm py-16">No products match your search.</div>
    </main>

    <footer class="bg-[#065F46] text-emerald-50 text-center text-xs py-6 mt-12">
        © Deliplus UK · Authentic Spanish cosmetics, shipped worldwide 🌍 · Secure payments by Stripe
    </footer>

    <!-- Slide-over basket -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 sm:p-5 border-b flex justify-between items-center bg-[#006838] text-white">
                <h2 class="text-lg font-bold">🛒 Your Basket</h2>
                <button onclick="toggleCart()" class="text-white/80 hover:text-white text-2xl font-bold px-2">&times;</button>
            </div>

            <div id="cart-items" class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-3.5 divide-y divide-gray-100"></div>

            <div class="p-4 sm:p-5 border-t bg-gray-50 space-y-3">
                <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider">Global Delivery Details</h3>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">First name *</label>
                        <input type="text" id="checkout-name" placeholder="Your first name" class="w-full text-xs border border-gray-200 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-[#006838] outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Surname *</label>
                        <input type="text" id="checkout-surname" placeholder="Your surname" class="w-full text-xs border border-gray-200 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-[#006838] outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Email *</label>
                        <input type="email" id="checkout-email" placeholder="you@example.com" class="w-full text-xs border border-gray-200 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-[#006838] outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Phone *</label>
                        <input type="tel" id="checkout-phone" placeholder="+44 7..." class="w-full text-xs border border-gray-200 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-[#006838] outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 mb-1">Full delivery address *</label>
                    <input type="text" id="checkout-address" placeholder="Street, city, postcode, country..." class="w-full text-xs border border-gray-200 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-[#006838] outline-none">
                </div>

                <div class="flex justify-between items-center text-base font-bold pt-3 border-t border-gray-200">
                    <span>Total:</span>
                    <span id="cart-total" class="text-[#007A48] text-xl font-black">£0.00</span>
                </div>

                <button onclick="checkoutStripe()" id="checkout-btn" class="w-full bg-[#007A48] hover:bg-[#006838] text-white py-3.5 rounded-xl font-bold transition shadow-md">
                    <span>Pay securely with Stripe 💳</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* Catalogue is fetched from the server — the server is the single
           source of truth for prices (base cost × 2.5, GBP, integer pence). */
        let products = [];
        let cart = [];
        let currentCategory = 'all';
        let cardQuantities = {};
        let wishlist = new Set();
        let searchTerm = '';

        try { wishlist = new Set(JSON.parse(localStorage.getItem('dp-wishlist') || '[]')); } catch (e) {}

        const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });

        const CATEGORIES = [
            { id: 'all',    name: 'All products' },
            { id: 'makeup', name: 'Makeup' },
            { id: 'eyes',   name: 'Eyes & Brows' },
            { id: 'lips',   name: 'Lips' },
            { id: 'face',   name: 'Facial Care' },
            { id: 'body',   name: 'Body Care' },
            { id: 'hair',   name: 'Hair Care' }
        ];

        async function loadProducts() {
            const res = await fetch('/api/products');
            products = await res.json();
            renderCategories();
            renderProducts();
            /* Support ?add=ID deep links from SEO product pages */
            const addId = parseInt(new URLSearchParams(window.location.search).get('add'), 10);
            if (addId && products.find(p => p.id === addId)) { addToCart(addId); history.replaceState(null, '', '/'); }
            /* Restore category from URL hash (#makeup etc.) — keeps filtered views shareable */
            const hashCat = (location.hash || '').replace('#', '');
            if (hashCat && CATEGORIES.some(c => c.id === hashCat)) filterCategory(hashCat, false);
        }

        function catCount(id) {
            return id === 'all' ? products.length : products.filter(p => p.category === id).length;
        }

        function renderCategories() {
            document.getElementById('category-buttons').innerHTML = CATEGORIES.map(cat => {
                const active = currentCategory === cat.id;
                const base = active
                    ? 'bg-[#006838] text-white shadow-sm'
                    : 'bg-[#F1F5F9] text-[#1E293B] hover:bg-[#E2E8F0]';
                const badge = active ? 'bg-[#005934] text-white' : 'bg-[#E2E8F0] text-[#334155]';
                return `
                    <button data-cat="${cat.id}" onclick="filterCategory('${cat.id}', true)" class="px-4 py-2 rounded-2xl text-xs sm:text-sm font-semibold ${base} transition whitespace-nowrap flex items-center gap-2">
                        <span>${cat.name}</span>
                        <span class="text-[11px] px-2 py-0.5 rounded-full ${badge}">${catCount(cat.id)}</span>
                    </button>`;
            }).join('');
        }

        /* Client-side filter: toggle card visibility (no re-render, no page reload) */
        function filterCategory(cat, push) {
            currentCategory = cat;
            renderCategories();
            applyFilters();
            if (push === true) history.pushState(null, '', cat === 'all' ? '/' : '#' + cat);
        }

        function applyFilters() {
            let visible = 0;
            document.querySelectorAll('#product-grid [data-category]').forEach(card => {
                const catOk = currentCategory === 'all' || card.dataset.category === currentCategory;
                const searchOk = !searchTerm || card.dataset.name.includes(searchTerm);
                const show = catOk && searchOk;
                card.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            document.getElementById('no-results').classList.toggle('hidden', visible > 0);
        }

        function cardHtml(p) {
            const inWish = wishlist.has(p.id);
            return `
            <div class="dp-card relative bg-white rounded-2xl border border-[#E2E8F0] shadow-sm flex flex-col overflow-hidden" data-category="${p.category}" data-name="${p.name.toLowerCase()}">
                <button onclick="toggleWishlist(${p.id}, this)" title="Add to wishlist" class="absolute top-2.5 right-2.5 z-10 bg-white/90 rounded-full p-1.5 shadow-sm hover:scale-110 transition">
                    <svg class="h-5 w-5 pointer-events-none" fill="${inWish ? '#e11d48' : 'none'}" stroke="${inWish ? '#e11d48' : '#1E293B'}" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                </button>
                <a href="/product/${p.id}" class="block bg-white">
                    <img src="${p.image}" alt="${p.name} — authentic Deliplus product" loading="lazy" class="w-full h-48 sm:h-56 object-contain p-3">
                </a>
                <div class="px-4 pb-4 flex flex-col gap-3 flex-1">
                    <a href="/product/${p.id}" class="text-[13px] leading-snug font-medium text-[#0F172A] hover:text-[#006838] line-clamp-2 min-h-[2.4rem]">${p.name}</a>
                    <div class="flex items-center justify-between">
                        <span class="text-lg font-black text-[#007A48]">${gbp.format(p.price)}</span>
                        <div class="flex items-center bg-[#F1F5F9] rounded-full overflow-hidden">
                            <button onclick="changeCardQty(${p.id}, -1)" class="px-3 py-1.5 text-[#334155] hover:bg-[#E2E8F0] font-bold text-sm">−</button>
                            <span id="card-qty-${p.id}" class="px-2 text-sm font-bold min-w-[1.4rem] text-center">${cardQuantities[p.id] || 1}</span>
                            <button onclick="changeCardQty(${p.id}, 1)" class="px-3 py-1.5 text-[#334155] hover:bg-[#E2E8F0] font-bold text-sm">+</button>
                        </div>
                    </div>
                    <button onclick="addToCart(${p.id})" class="w-full bg-[#007A48] hover:bg-[#006838] text-white py-2.5 rounded-xl text-[13px] font-semibold transition flex items-center justify-center gap-2">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                        Add to basket
                    </button>
                    <a href="/product/${p.id}" class="w-full bg-white border border-[#E2E8F0] hover:border-[#006838] hover:text-[#006838] text-[#0F172A] py-2.5 rounded-xl text-[13px] font-semibold transition flex items-center justify-center gap-2">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        View product
                    </a>
                </div>
            </div>`;
        }

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(cardHtml).join('');
            applyFilters();
        }

        function changeCardQty(id, delta) {
            const next = Math.min(99, Math.max(1, (cardQuantities[id] || 1) + delta));
            cardQuantities[id] = next;
            document.getElementById('card-qty-' + id).textContent = next;
        }

        function toggleWishlist(id, btn) {
            if (wishlist.has(id)) wishlist.delete(id); else wishlist.add(id);
            localStorage.setItem('dp-wishlist', JSON.stringify([...wishlist]));
            const svg = btn.querySelector('svg');
            const on = wishlist.has(id);
            svg.setAttribute('fill', on ? '#e11d48' : 'none');
            svg.setAttribute('stroke', on ? '#e11d48' : '#1E293B');
        }

        function showWishlist() {
            if (wishlist.size === 0) { alert('Your wishlist is empty. Tap the heart on any product to save it here.'); return; }
            const names = products.filter(p => wishlist.has(p.id)).map(p => '• ' + p.name + ' — ' + gbp.format(p.price)).join('\n');
            alert('Your wishlist (' + wishlist.size + '):\n\n' + names + '\n\nWishlist items are saved in this browser.');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            const qtyToAdd = cardQuantities[id] || 1;
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty += qtyToAdd; } else { cart.push({ ...product, qty: qtyToAdd }); }
            cardQuantities[id] = 1;
            const el = document.getElementById('card-qty-' + id); if (el) el.textContent = 1;
            updateCartUI();
            toggleCart(true);
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').textContent = count;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400 text-sm">Your basket is empty</div>`;
                document.getElementById('cart-total').textContent = '£0.00';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between pt-3';
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${item.image}" class="w-12 h-12 object-contain rounded-xl border border-gray-100" alt="">
                        <div>
                            <h4 class="text-xs font-semibold text-gray-800 w-36 truncate">${item.name}</h4>
                            <p class="text-xs text-gray-500">${gbp.format(item.price)} × ${item.qty} = <span class="font-bold text-[#007A48]">${gbp.format(itemTotal)}</span></p>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${item.id})" class="text-gray-400 hover:text-red-500 text-lg font-bold p-1">&times;</button>`;
                container.appendChild(div);
            });
            document.getElementById('cart-total').textContent = gbp.format(total);
        }

        function removeFromCart(id) { cart = cart.filter(item => item.id !== id); updateCartUI(); }
        function toggleCart(open) {
            const m = document.getElementById('cart-modal');
            if (open) m.classList.remove('hidden'); else m.classList.toggle('hidden');
        }

        function bindSearch(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', e => {
                searchTerm = e.target.value.trim().toLowerCase();
                applyFilters();
            });
        }

        window.addEventListener('popstate', () => {
            const hashCat = (location.hash || '').replace('#', '') || 'all';
            if (CATEGORIES.some(c => c.id === hashCat)) filterCategory(hashCat, false);
        });

        async function checkoutStripe() {
            if (cart.length === 0) { alert('Your basket is empty.'); return; }

            const name = document.getElementById('checkout-name').value.trim();
            const surname = document.getElementById('checkout-surname').value.trim();
            const email = document.getElementById('checkout-email').value.trim();
            const phone = document.getElementById('checkout-phone').value.trim();
            const address = document.getElementById('checkout-address').value.trim();

            if (!name || !surname || !email || !phone || !address) {
                alert('Please complete all required contact and delivery fields.');
                return;
            }

            const btn = document.getElementById('checkout-btn');
            btn.disabled = true;
            btn.textContent = 'Connecting to Stripe…';

            try {
                const response = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        /* Only ids + quantities are sent — the server prices the order */
                        cart: cart.map(i => ({ id: i.id, qty: i.qty })),
                        customer: { name, surname, email, phone, address }
                    })
                });

                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert('Error: ' + (data.error || 'Could not start the payment session'));
                    btn.disabled = false;
                    btn.textContent = 'Pay securely with Stripe 💳';
                }
            } catch (err) {
                console.error(err);
                alert('Network error while connecting to the payment server.');
                btn.disabled = false;
                btn.textContent = 'Pay securely with Stripe 💳';
            }
        }

        bindSearch('product-search');
        bindSearch('product-search-mobile');
        loadProducts();
    </script>
</body>
</html>
