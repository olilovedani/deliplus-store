<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you for your order! | Deliplus UK</title>
    <meta name="robots" content="noindex, follow">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-3xl shadow-lg border border-gray-100 max-w-md w-full mx-4 p-10 text-center">
        <div class="w-16 h-16 mx-auto bg-emerald-100 rounded-full flex items-center justify-center mb-5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-emerald-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h1 class="text-2xl font-black text-emerald-700 mb-2">Payment successful!</h1>
        <p class="text-sm text-gray-600 mb-6">Thank you for your order. We've received your payment and will send your confirmation by email. Your order will be prepared and shipped with <strong>worldwide delivery</strong> as soon as possible. 🌍</p>
        <p id="session-id" class="text-[11px] text-gray-400 mb-6 break-all"></p>
        <a href="/" class="inline-block bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-8 rounded-xl transition shadow-md">Back to the store</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const sid = params.get('session_id');
        if (sid) document.getElementById('session-id').innerText = 'Order reference: ' + sid;
    </script>
</body>
</html>
